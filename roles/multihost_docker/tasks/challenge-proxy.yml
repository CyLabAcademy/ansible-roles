---

# nginx answering <port>.<host> from that challenge port, so a player whose network allows
# only web ports can still reach web challenges. See templates/challenge_proxy.service.j2
# for how the container runs, and challenge_proxy_update.sh.j2 for how it stays current.

- name: Deploy the challenge proxy
  when: challenge_proxy_enabled | bool
  block:
    - name: Check the challenge proxy forwards every port cork hands out
      vars:
        ports: "{{ challenge_proxy_expected_ports.split('-') | map('int') | list }}"
        pattern: "^({{ challenge_proxy_port_regex }})$"
      ansible.builtin.assert:
        that:
          - ports[0] | string is match(pattern)
          - ports[1] | string is match(pattern)
          - not ((ports[0] - 1) | string is match(pattern))
        fail_msg: >-
          challenge_proxy_port_regex '{{ challenge_proxy_port_regex }}' does not cover cork's
          ports {{ challenge_proxy_expected_ports }}, or reaches below them.
      when: challenge_proxy_expected_ports is truthy

    - name: Check whether the challenge proxy image is present
      ansible.builtin.command: docker image inspect {{ challenge_proxy_image }}
      register: challenge_proxy_image_inspect
      changed_when: false
      failed_when: false
      check_mode: false

    # Here rather than in the unit, so a registry that cannot be reached fails the play
    # instead of leaving the unit restarting with no proxy.
    - name: Pull the challenge proxy image
      ansible.builtin.command: docker pull {{ challenge_proxy_image }}
      when: challenge_proxy_image_inspect.rc != 0
      changed_when: true

    - name: Ensure the challenge proxy config directory exists
      ansible.builtin.file:
        path: "{{ challenge_proxy_conf_dir }}"
        state: directory
        mode: "0755"

    # Players' addresses, so not world-readable. nginx's master opens the log as root and
    # its workers inherit it.
    - name: Ensure the challenge proxy log directory exists
      ansible.builtin.file:
        path: "{{ challenge_proxy_log_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Ensure the challenge proxy log rotation config is present
      ansible.builtin.template:
        src: challenge_proxy.logrotate.j2
        dest: "{{ challenge_proxy_conf_dir }}/logrotate.conf"
        mode: "0644"

    # nginx -t opens the log files too, so the log directory is mounted for it.
    - name: Ensure the challenge proxy config is present
      ansible.builtin.template:
        src: challenge_proxy.nginx.conf.j2
        dest: "{{ challenge_proxy_conf_dir }}/nginx.conf"
        mode: "0644"
        validate: >-
          docker run --rm --network none --userns host
          --volume {{ challenge_proxy_conf_dir }}:{{ challenge_proxy_conf_dir }}:ro
          --volume {{ challenge_proxy_log_dir }}:{{ challenge_proxy_log_dir }}
          --volume %s:/etc/nginx/candidate.conf:ro
          --entrypoint /usr/sbin/nginx {{ challenge_proxy_image }} -t -c /etc/nginx/candidate.conf
      notify:
        - Reload challenge proxy

    - name: Ensure the challenge proxy unit is present
      ansible.builtin.template:
        src: challenge_proxy.service.j2
        dest: "{{ systemd_unit_dir }}/{{ challenge_proxy_service }}"
        mode: "0644"
      register: challenge_proxy_unit
      notify:
        - Reload systemd config
        - Restart challenge proxy

    # Under --check a unit the template would write is not there for systemd to look up.
    - name: Ensure the challenge proxy is enabled and started
      ansible.builtin.systemd:
        name: "{{ challenge_proxy_service }}"
        enabled: yes
        state: started
        daemon_reload: yes
      when: not (ansible_check_mode and challenge_proxy_unit is changed)

    - name: Ensure the challenge proxy update script is present
      ansible.builtin.template:
        src: challenge_proxy_update.sh.j2
        dest: "{{ challenge_proxy_update_script }}"
        mode: "0755"

    - name: Ensure the challenge proxy update units are present
      ansible.builtin.template:
        src: "challenge_proxy_update.{{ item }}.j2"
        dest: "{{ systemd_unit_dir }}/{{ challenge_proxy_update_unit }}.{{ item }}"
        mode: "0644"
      loop: [service, timer]
      register: challenge_proxy_update_units

    # Restarted on a change, so a new schedule replaces the old one rather than waiting.
    - name: Ensure the challenge proxy update timer is enabled and running
      ansible.builtin.systemd:
        name: "{{ challenge_proxy_update_unit }}.timer"
        enabled: yes
        state: "{{ 'restarted' if challenge_proxy_update_units is changed else 'started' }}"
        daemon_reload: yes
      when: not (ansible_check_mode and challenge_proxy_update_units is changed)

    - name: Ensure the challenge proxy log rotation units are present
      ansible.builtin.template:
        src: "challenge_proxy_logrotate.{{ item }}.j2"
        dest: "{{ systemd_unit_dir }}/{{ challenge_proxy_logrotate_unit }}.{{ item }}"
        mode: "0644"
      loop: [service, timer]
      register: challenge_proxy_logrotate_units

    - name: Ensure the challenge proxy log rotation timer is enabled and running
      ansible.builtin.systemd:
        name: "{{ challenge_proxy_logrotate_unit }}.timer"
        enabled: yes
        state: "{{ 'restarted' if challenge_proxy_logrotate_units is changed else 'started' }}"
        daemon_reload: yes
      when: not (ansible_check_mode and challenge_proxy_logrotate_units is changed)

# Turning it off removes it, rather than leaving a public listener nobody configured.
- name: Remove the challenge proxy
  when: not (challenge_proxy_enabled | bool)
  block:
    - name: Ensure the challenge proxy and its timers are stopped and disabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - "{{ challenge_proxy_update_unit }}.timer"
        - "{{ challenge_proxy_logrotate_unit }}.timer"
        - "{{ challenge_proxy_service }}"
      # Absent on a host that never ran it.
      failed_when: false

    # The log directory stays: it is a record of what the proxy served.
    - name: Ensure the challenge proxy units, script and config are absent
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ systemd_unit_dir }}/{{ challenge_proxy_update_unit }}.timer"
        - "{{ systemd_unit_dir }}/{{ challenge_proxy_update_unit }}.service"
        - "{{ systemd_unit_dir }}/{{ challenge_proxy_logrotate_unit }}.timer"
        - "{{ systemd_unit_dir }}/{{ challenge_proxy_logrotate_unit }}.service"
        - "{{ systemd_unit_dir }}/{{ challenge_proxy_service }}"
        - "{{ challenge_proxy_update_script }}"
        - "{{ challenge_proxy_conf_dir }}"
        - /var/lib/logrotate/challenge-proxy.status
      notify:
        - Reload systemd config
